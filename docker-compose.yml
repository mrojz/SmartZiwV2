services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:4.4
    container_name: procurement-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-s0yIf0rtPcDRr1TUnVxN}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      # Host is IPv6-only: build containers on the default bridge get no DNS,
      # so apt/pip inside builds fail ("Temporary failure resolving ...").
      network: host
    container_name: procurement-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://admin:${MONGO_PASSWORD:-s0yIf0rtPcDRr1TUnVxN}@mongo:27017
      - SYNC_SECRET=${SYNC_SECRET:-procurement-sync-secret-2024}
    depends_on:
      - mongo
    restart: unless-stopped

  # ── Vite + React Frontend (production build + Nginx) ───
  frontend:
    build:
      context: ./frontend
      # Same reason as backend: npm ci needs DNS during build.
      network: host
    container_name: procurement-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: