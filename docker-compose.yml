services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: procurement-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build: ./backend
    container_name: procurement-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://admin:${MONGO_PASSWORD:-changeme}@mongo:27017
    depends_on:
      - mongo

  # ── Vite + React Frontend (production build + Nginx) ───
  frontend:
    build: ./frontend
    container_name: procurement-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
