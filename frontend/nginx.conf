server {
    listen 80;
    # Allow comment attachments up to the backend's 50 MB file limit.
    # The extra headroom covers multipart/form-data request overhead.
    client_max_body_size 55m;

    # Serve the built React app
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Block external access to internal sync endpoint
    location /api/sync/start {
        return 403;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;           # needed for SSE streams
    }
}
